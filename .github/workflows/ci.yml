name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the caches, the timeouts and the
  # gate that always reports live there. This file says only what is this product's. Keep the pinned SHA current (Dependabot).
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@d95527618e5b070cff81d248964290b732e31886 # v1.4.0
    permissions:
      contents: read
    with:
      package-manager: pnpm
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      after-build: scripts/ci-after-build.sh
      ignore: '^docs/|^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|assets/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'

  # The job name is the required status check on main: kept by a shim that reads the gate's verdict.
  verify:
    name: Lint · Typecheck · Tests · Build
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success
